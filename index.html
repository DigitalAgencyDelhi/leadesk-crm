<script>
const ST=['Closed','Connected','Not Responding','Followup','Lost'];

function save(){}

if(t=='all')return 1;if(t=='today')return ts>=s0;if(t=='yesterday')return ts>=s0-864e5&&ts<s0;if(t=='week')return ts>=s0-6*864e5;

${chFixed?'':`<select onchange="setF('c',this.value)">${o(Object.entries(CH),F.c,'Leads from')}</select>`}

function parseCSV(t){const r=[];let row=[],c='',q=0;t=t.replace(/^\ufeff/,'');for(let i=0;i<t.length;i++){const ch=t[i];if(q){if(ch=='"'){if(t[i+1]=='"'){c+='"';i++}else q=0}else c+=ch}else if(ch=='"')q=1;else if(ch==','){row.push(c);c=''}else if(ch=='\n'||ch=='\r'){if(ch=='\r'&&t[i+1]=='\n')i++;row.push(c);c='';if(row.some(x=>x.trim()))r.push(row);row=[]}else c+=ch}row.push(c);if(row.some(x=>x.trim()))r.push(row);return r}
